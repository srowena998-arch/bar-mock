<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background Plate -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Subtle Inner Ring -->
  <circle cx="128" cy="128" r="102" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.35"/>

  <!-- Laurel Wreath Left -->
  <path d="M 64 165 C 50 140 50 100 75 72 C 73 82 76 96 86 102 C 76 112 74 130 84 140 C 74 148 72 160 88 168 C 76 174 72 188 94 194" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Laurel Wreath Right -->
  <path d="M 192 165 C 206 140 206 100 181 72 C 183 82 180 96 170 102 C 180 112 182 130 172 140 C 182 148 184 160 168 168 C 180 174 184 188 162 194" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Center Pillar / Scales of Justice Stand -->
  <path d="M 128 50 L 128 178" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Top Finial / Diamond -->
  <polygon points="128,36 136,48 128,60 120,48" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Scales Balance Crossbeam -->
  <path d="M 68 84 Q 128 76 188 84" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Center Pivot Circle -->
  <circle cx="128" cy="80" r="7" fill="url(#goldGrad)"/>
  <circle cx="128" cy="80" r="3" fill="#0f172a"/>

  <!-- Left Scale Pan Strings -->
  <line x1="68" y1="84" x2="48" y2="124" stroke="#fbbf24" stroke-width="1.8" opacity="0.85"/>
  <line x1="68" y1="84" x2="88" y2="124" stroke="#fbbf24" stroke-width="1.8" opacity="0.85"/>
  <!-- Left Scale Pan Bowl -->
  <path d="M 44 124 Q 68 142 92 124 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Right Scale Pan Strings -->
  <line x1="188" y1="84" x2="168" y2="124" stroke="#fbbf24" stroke-width="1.8" opacity="0.85"/>
  <line x1="188" y1="84" x2="208" y2="124" stroke="#fbbf24" stroke-width="1.8" opacity="0.85"/>
  <!-- Right Scale Pan Bowl -->
  <path d="M 164 124 Q 188 142 212 124 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Pedestal / Base -->
  <rect x="94" y="174" width="68" height="8" rx="4" fill="url(#goldGrad)"/>
  <rect x="80" y="182" width="96" height="10" rx="5" fill="url(#goldGrad)"/>

  <!-- Subtitle Ribbon: 2026 BAR -->
  <rect x="68" y="200" width="120" height="26" rx="8" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="128" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="2">BAR 2026</text>
</svg>
